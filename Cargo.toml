[package]
name = "nono-node"
version = "0.4.0"
edition = "2021"
rust-version = "1.77"
authors = ["Luke Hinds <luke@hinds.email>"]
license = "Apache-2.0"
repository = "https://github.com/always-further/nono"
homepage = "https://github.com/always-further/nono"
description = "Node.js/TypeScript bindings for nono capability-based sandboxing library"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
nono = { version = "0.59.0" }
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
