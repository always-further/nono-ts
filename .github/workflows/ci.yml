name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Checkout nono core dependency
        run: |
          if [ ! -d ../nono/.git ]; then
            git clone --depth 1 https://github.com/nolabs-ai/nono.git ../nono
          fi
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - name: TypeScript type check
        run: npm run typecheck
      - name: Biome lint + format check
        run: npm run lint

  examples-docs-smoke:
    name: Examples + Docs Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Checkout nono core dependency
        run: |
          if [ ! -d ../nono/.git ]; then
            git clone --depth 1 https://github.com/nolabs-ai/nono.git ../nono
          fi
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npm ci
      - name: Build local native addon
        run: npm run build:debug
      - name: Run smoke tests (subprocess)
        run: npm test -- --reporter=verbose tests/smoke/smoke.test.ts
      - name: Run demonstrator dry-run
        run: npm run demo:dry-run
      - name: Fail on stale docs route pattern
        run: |
          if [ ! -d "docs" ]; then
            echo "Error: docs directory not found"
            exit 1
          fi
          if grep -R -n '/sdk/' docs; then
            echo "Found stale /sdk/ routes in docs."
            exit 1
          fi

  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Checkout nono core dependency
        run: |
          if [ ! -d ../nono/.git ]; then
            git clone --depth 1 https://github.com/nolabs-ai/nono.git ../nono
          fi
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npm ci
      - name: Build native module
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binding-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  test:
    name: Test - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: binding-x86_64-unknown-linux-gnu
      - name: Run tests
        run: npm test
